// ── Ring ──────────────────────────────────────────────────────────────────────
function Ring({value,max,label,color,size=160}){
  const[d,setD]=useState(0);
  const r=size/2*.78,circ=2*Math.PI*r;
  useEffect(()=>{
    if(!value){setD(0);return;}
    let s=null;const to=value;
    const go=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/900,1),e=1-Math.pow(1-p,3);setD(Math.round(to*e));if(p<1)requestAnimationFrame(go);};
    requestAnimationFrame(go);
  },[value]);
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#161e2a" strokeWidth={size*.09}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={size*.09}
          strokeDasharray={circ} strokeDashoffset={value?circ*(1-Math.min(d/max,1)):circ}
          strokeLinecap="round" style={{transition:"stroke-dashoffset .05s linear",filter:`drop-shadow(0 0 6px ${color}88)`}}/>
        <text x={size/2} y={size/2+2} textAnchor="middle" dominantBaseline="middle"
          fill="#eef2f7" fontSize={size*.165} fontWeight="800" fontFamily="'JetBrains Mono',monospace"
          style={{transformOrigin:`${size/2}px ${size/2}px`,transform:"rotate(90deg)"}}>
          {d>0?d.toLocaleString():"–"}
        </text>
      </svg>
      <span style={{color:"#6b7a8d",fontSize:10,letterSpacing:2.5,textTransform:"uppercase",fontWeight:600}}>{label}</span>
    </div>
  );
}

// ── Slider ────────────────────────────────────────────────────────────────────
function Slider({label,value,min,max,unit,onChange,color=C.cyan}){
  const pct=((value-min)/(max-min))*100;
  return(
    <div style={{marginBottom:22}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{color:"#8a96a8",fontSize:13,fontWeight:500}}>{label}</span>
        <span style={{color,fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:700,background:`${color}18`,padding:"2px 10px",borderRadius:6}}>{value}{unit}</span>
      </div>
      <div style={{position:"relative",height:8,borderRadius:4,background:"#161e2a"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,borderRadius:4,background:`linear-gradient(90deg,${color}66,${color})`,transition:"width .05s"}}/>
        <input type="range" min={min} max={max} value={value} onChange={e=>onChange(Number(e.target.value))}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",
          width:20,height:20,borderRadius:"50%",background:color,border:"3px solid #0a0d12",
          pointerEvents:"none",boxShadow:`0 0 12px ${color}99`,transition:"left .05s"}}/>
      </div>
    </div>
  );
}

// ── AI Plan ───────────────────────────────────────────────────────────────────
function AIPlan({result,goal,lang,t}){
  const[plan,setPlan]=useState(null);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState(null);
  const tk=result?.tiers[0];

  async function gen(){
    setLoading(true);setErr(null);
    const gn={cut:"cutting (fat loss)",bulk:"bulking (muscle gain)",maint:"maintenance"}[goal];
    const prompt=`Create a 7-day meal plan. Goal: ${gn}. Daily: ${tk?.kcal} kcal, ${result.protein}g protein, ~${tk?.macros?.carb}g carbs, ~${tk?.macros?.fat}g fat.
Return ONLY valid JSON: {"days":[{"day":"Monday","meals":[{"type":"Breakfast","name":"...","kcal":400,"protein":30,"carbs":45,"fat":10},{"type":"Lunch","name":"...","kcal":500,"protein":35,"carbs":50,"fat":15},{"type":"Dinner","name":"...","kcal":600,"protein":40,"carbs":55,"fat":18},{"type":"Snack","name":"...","kcal":200,"protein":15,"carbs":20,"fat":6}]},...7 days]}
Use healthy, varied, realistic meals. Hit targets closely.`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const data=await r.json();
      const txt=data.content?.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
      setPlan(JSON.parse(txt));
    }catch(e){setErr(t.ai.err);}
    setLoading(false);
  }

  function pdf(){
    const el=document.getElementById("plan-print");
    if(!el)return;
    const orig=document.body.innerHTML;
    document.body.innerHTML=`<div style="font-family:sans-serif;padding:24px;color:#111;max-width:700px;margin:auto"><h2 style="margin-bottom:20px">MacroCoach – Week Plan</h2>${el.innerHTML}</div>`;
    window.print();document.body.innerHTML=orig;window.location.reload();
  }

  const mealC={"Breakfast":C.yellow,"Lunch":C.green,"Dinner":C.cyan,"Snack":C.orange};

  return(
    <Card glow={C.gold}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <div style={{color:C.gold,fontWeight:800,fontSize:16,marginBottom:2}}>{t.ai.title}</div>
          <div style={{color:"#5a6878",fontSize:11}}>✦ Premium Feature</div>
        </div>
        {plan&&<button onClick={pdf} style={{background:`${C.gold}20`,border:`1px solid ${C.gold}50`,color:C.gold,fontSize:11,fontWeight:700,padding:"7px 13px",borderRadius:9,cursor:"pointer"}}>{t.ai.pdf}</button>}
      </div>
      {!plan&&!loading&&(
        <button onClick={gen} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",
          background:`linear-gradient(135deg,${C.gold},#fb923c)`,color:"#0a0d12",fontWeight:800,fontSize:14,cursor:"pointer",
          boxShadow:`0 4px 24px ${C.gold}44`,letterSpacing:.3}}>
          🤖 {t.ai.gen}
        </button>
      )}
      {loading&&<div style={{textAlign:"center",padding:"36px 0"}}><div style={{fontSize:36,marginBottom:12,display:"inline-block"}} className="spin">⚙️</div><div style={{color:"#6b7a8d",fontSize:13}} className="pulse">{t.ai.generating}</div></div>}
      {err&&<div style={{color:C.orange,fontSize:13,textAlign:"center",padding:12,background:`${C.orange}10`,borderRadius:10}}>{err}</div>}
      {plan&&(
        <div id="plan-print">
          {plan.days.map((day,di)=>{
            const tot=day.meals.reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.protein,c:a.c+m.carbs,f:a.f+m.fat}),{k:0,p:0,c:0,f:0});
            return(
              <div key={di} style={{marginBottom:10,borderRadius:14,border:"1px solid #1e2a3a",overflow:"hidden"}}>
                <div style={{background:`${C.gold}12`,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1e2a3a"}}>
                  <span style={{color:C.gold,fontWeight:700,fontSize:13}}>{day.day}</span>
                  <span style={{color:"#6b7a8d",fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>{tot.k} kcal · {tot.p}g P</span>
                </div>
                {day.meals.map((m,mi)=>{
                  const mc=mealC[m.type]||C.cyan;
                  return(
                    <div key={mi} style={{padding:"9px 14px",borderBottom:mi<day.meals.length-1?"1px solid #161e2a":"none",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div>
                        <div style={{fontSize:9,color:mc,fontWeight:700,marginBottom:3,textTransform:"uppercase",letterSpacing:1.5}}>{m.type}</div>
                        <div style={{fontSize:13,color:"#c8d4e0",fontWeight:600}}>{m.name}</div>
                      </div>
                      <div style={{textAlign:"right",fontSize:10,color:"#4a5868",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.9}}>
                        <div style={{color:"#8a96a8",fontWeight:700}}>{m.kcal}</div>
                        <div>P{m.protein} C{m.carbs} F{m.fat}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
          <button onClick={gen} style={{width:"100%",padding:"10px",borderRadius:10,border:`1px solid ${C.gold}40`,background:"transparent",color:C.gold,fontWeight:700,fontSize:12,cursor:"pointer",marginTop:4}}>
            {t.ai.regen}
          </button>
        </div>
      )}
    </Card>
  );
}

  const SK="mc_track";
  const[entries,setEntries]=useState(()=>{try{const s=sessionStorage.getItem(SK);return s?JSON.parse(s):[];}catch{return[];}});
  const[form,setForm]=useState({date:new Date().toISOString().split("T")[0],weight:"",kcal:"",notes:""});
  const[open,setOpen]=useState(false);

  function save(){
    if(!form.weight&&!form.kcal)return;
    const n=[...entries,{...form,id:Date.now()}].sort((a,b)=>a.date.localeCompare(b.date));
    setEntries(n);try{sessionStorage.setItem(SK,JSON.stringify(n));}catch{}
    setForm({date:new Date().toISOString().split("T")[0],weight:"",kcal:"",notes:""});setOpen(false);
  }
  function del(id){const n=entries.filter(e=>e.id!==id);setEntries(n);try{sessionStorage.setItem(SK,JSON.stringify(n));}catch{}}

  const ws=entries.filter(e=>e.weight).map(e=>parseFloat(e.weight)||0);
  const maxW=ws.length?Math.max(...ws):100,minW=ws.length?Math.min(...ws):50;

  const inp={width:"100%",background:"#0d1118",border:"1px solid #1e2a3a",borderRadius:9,padding:"9px 12px",color:"#eef2f7",fontSize:13,outline:"none",fontFamily:"'Inter',sans-serif"};

  return(
    <Card glow={C.gold}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div><div style={{color:C.gold,fontWeight:800,fontSize:16,marginBottom:2}}>{t.track.title}</div><div style={{color:"#5a6878",fontSize:11}}>✦ Premium Feature</div></div>
        <button onClick={()=>setOpen(v=>!v)} style={{background:open?`${C.gold}30`:`${C.gold}15`,border:`1px solid ${C.gold}50`,color:C.gold,fontSize:12,fontWeight:700,padding:"7px 13px",borderRadius:9,cursor:"pointer"}}>{t.track.add}</button>
      </div>
      {open&&(
        <div style={{background:"#0d1118",borderRadius:12,padding:"16px",marginBottom:16,border:"1px solid #1e2a3a"}} className="fade-up">
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            {[{l:t.track.date,k:"date",tp:"date"},{l:t.track.weight,k:"weight",tp:"number",ph:"75.5"},{l:t.track.kcal,k:"kcal",tp:"number",ph:"2100"}].map(f=>(
              <div key={f.k} style={{flex:"1 1 110px"}}>
                <div style={{color:"#6b7a8d",fontSize:11,fontWeight:600,marginBottom:5}}>{f.l}</div>
                <input type={f.tp} value={form[f.k]} placeholder={f.ph||""} onChange={e=>setForm(v=>({...v,[f.k]:e.target.value}))} style={inp}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:12}}>
            <div style={{color:"#6b7a8d",fontSize:11,fontWeight:600,marginBottom:5}}>{t.track.notes}</div>
            <input type="text" value={form.notes} onChange={e=>setForm(v=>({...v,notes:e.target.value}))} style={inp}/>
          </div>
          <button onClick={save} style={{background:`linear-gradient(90deg,${C.gold},#fb923c)`,border:"none",color:"#0a0d12",fontWeight:700,fontSize:13,padding:"9px 22px",borderRadius:9,cursor:"pointer"}}>{t.track.save}</button>
        </div>
      )}
      {entries.length===0
        ?<div style={{textAlign:"center",padding:"28px 0",color:"#4a5868",fontSize:13}}>{t.track.empty}</div>
        :(
          <>
            {ws.length>1&&(
              <div style={{marginBottom:14}}>
                <div style={{color:"#6b7a8d",fontSize:10,letterSpacing:2,textTransform:"uppercase",fontWeight:600,marginBottom:8}}>{t.track.chart}</div>
                <div style={{height:56,display:"flex",alignItems:"flex-end",gap:3,background:"#0d1118",borderRadius:10,padding:"6px 8px"}}>
                  {entries.filter(e=>e.weight).map((e,i)=>{
                    const w=parseFloat(e.weight)||0,pct=maxW===minW?.5:((w-minW)/(maxW-minW));
                    return(
                      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                        <div style={{width:"100%",height:Math.max(6,Math.round(pct*38)),background:`linear-gradient(180deg,${C.gold},${C.gold}66)`,borderRadius:3}}/>
                        <div style={{fontSize:7,color:"#4a5868"}}>{w}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {[...entries].reverse().slice(0,8).map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:"#0d1118",borderRadius:11,border:"1px solid #1a2333"}}>
                  <div>
                    <div style={{color:"#c8d4e0",fontSize:12,fontWeight:600}}>{e.date}</div>
                    <div style={{fontSize:11,color:"#4a5868",marginTop:3}}>
                      {e.weight&&`⚖️ ${e.weight}kg`}{e.weight&&e.kcal?" · ":""}{e.kcal&&`🔥 ${e.kcal} kcal`}
                      {targetKcal&&e.kcal&&<span style={{color:parseInt(e.kcal)<=targetKcal?C.green:C.orange,marginLeft:5,fontWeight:600}}>({parseInt(e.kcal)<=targetKcal?"✓":"+"+( parseInt(e.kcal)-targetKcal)})</span>}
                    </div>
                    {e.notes&&<div style={{fontSize:10,color:"#4a5868",marginTop:2,fontStyle:"italic"}}>{e.notes}</div>}
                  </div>
                  <button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:"#2a3848",cursor:"pointer",fontSize:16,padding:"4px 6px",borderRadius:6}}>{t.track.del}</button>
                </div>
              ))}
            </div>
          </>
        )
      }
    </Card>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[lang,setLang]=useState("en");
  const[lmenu,setLmenu]=useState(false);
  const[goal,setGoal]=useState("cut");
  const[gender,setGender]=useState("male");
  const[age,setAge]=useState(25);
  const[wt,setWt]=useState(85);
  const[ht,setHt]=useState(178);
  const[kfa,setKfa]=useState(20);
  const[act,setAct]=useState(2);
  const[res,setRes]=useState(null);
  const[ak,setAk]=useState(0);
  const[modal,setModal]=useState(false);
  const[tab,setTab]=useState("results");
  const ref=useRef(null);
  const t=T[lang]||T.en;
  const gc=GCOL[goal];

  function calc(){
    const lbm=wt*(1-kfa/100),bmr=370+21.6*lbm,tdee=Math.round(bmr*ACT[act]),prot=Math.round(lbm*2.2);
    const tiers=t.res.tiers[goal].map(r=>{
      const kcal=goal==="cut"?tdee-r.def:tdee+(r.sur||0);
      const fk=Math.round(kcal*.22),ck=kcal-prot*4-fk;
      return{...r,kcal,macros:{prot,fat:Math.round(fk/9),carb:Math.round(Math.max(ck,0)/4)}};
    });
    setAk(k=>k+1);setRes({tdee,bmr:Math.round(bmr),lbm:Math.round(lbm),protein:prot,tiers});setTab("results");
    setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth",block:"start"}),120);
  }

  const go=id=>{document.getElementById(id)?.scrollIntoView({behavior:"smooth"});setLmenu(false);};

  return(
    <div style={{minHeight:"100vh",background:"#0a0d12",color:"#eef2f7"}} onClick={()=>lmenu&&setLmenu(false)}>

      {/* ── NAV ── */}
      <nav style={{position:"sticky",top:0,zIndex:60,background:"#0a0d12dd",backdropFilter:"blur(16px)",borderBottom:"1px solid #161e2a",padding:"0 16px"}}>
        <div style={{maxWidth:1080,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:58}}>
          {/* Logo */}
          <div>
            <div style={{fontWeight:900,fontSize:17,background:`linear-gradient(90deg,${C.cyan},${C.green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1.1}}>{t.nav.logo}</div>
            <div style={{fontSize:9,color:"#3a4858",fontWeight:500,letterSpacing:.5,marginTop:1}}>by christhetic</div>
          </div>
          {/* Right */}
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <button onClick={()=>setModal(true)} style={{background:`linear-gradient(90deg,${C.gold},#fb923c)`,border:"none",color:"#0a0d12",fontWeight:700,fontSize:11,cursor:"pointer",padding:"7px 13px",borderRadius:9,whiteSpace:"nowrap"}}>✦ Premium</button>
            <button onClick={()=>go("calculator")} style={{background:`linear-gradient(90deg,${C.cyan},${C.green})`,border:"none",color:"#0a0d12",fontWeight:700,fontSize:11,cursor:"pointer",padding:"7px 13px",borderRadius:9,whiteSpace:"nowrap"}} className="hide-sm">{t.nav.start}</button>
            {/* Lang */}
            <div style={{position:"relative"}} onClick={e=>e.stopPropagation()}>
              <button onClick={()=>setLmenu(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 10px",borderRadius:9,border:"1px solid #1e2a3a",background:"#111620",color:"#8a96a8",fontSize:13,cursor:"pointer"}}>
                <span style={{fontSize:16}}>{T[lang].flag}</span>
                <span style={{fontSize:9,opacity:.5}}>▾</span>
              </button>
              {lmenu&&(
                <div style={{position:"absolute",right:0,top:"calc(100% + 8px)",background:"#111620",border:"1px solid #1e2a3a",borderRadius:14,overflow:"hidden",minWidth:148,boxShadow:"0 12px 40px #00000088",zIndex:100}}>
                  {Object.entries(T).map(([k,l])=>(
                    <button key={k} onClick={()=>{setLang(k);setRes(null);setLmenu(false);}}
                      style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 16px",background:lang===k?`${C.cyan}18`:"transparent",border:"none",color:lang===k?C.cyan:"#8a96a8",fontSize:13,cursor:"pointer",fontWeight:lang===k?700:500,textAlign:"left",borderBottom:"1px solid #161e2a"}}>
                      <span style={{fontSize:16}}>{l.flag}</span>{l.name}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      </nav>

      {/* ── HERO ── */}
      <section id="hero" style={{background:"radial-gradient(ellipse 90% 55% at 50% -5%,#00d4ff14,transparent),radial-gradient(ellipse 50% 40% at 80% 50%,#00ff9d08,transparent)",padding:"88px 20px 68px",textAlign:"center"}}>
        <div style={{maxWidth:560,margin:"0 auto"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${C.cyan}12`,border:`1px solid ${C.cyan}35`,borderRadius:999,padding:"6px 16px",marginBottom:28}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:C.cyan,display:"inline-block",boxShadow:`0 0 8px ${C.cyan}`}}/>
            <span style={{color:C.cyan,fontSize:11,fontWeight:700,letterSpacing:1.2}}>{t.hero.badge}</span>
          </div>
          <h1 style={{margin:"0 0 20px",fontSize:"clamp(30px,9vw,56px)",fontWeight:900,lineHeight:1.08,letterSpacing:-1.5}}>
            <span style={{color:"#d8e4f0"}}>{t.hero.h1} </span>
            <span style={{background:`linear-gradient(90deg,${C.cyan},${C.green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{t.hero.h2} </span>
            <span style={{color:"#d8e4f0"}}>{t.hero.h3}</span>
          </h1>
          <p style={{color:"#6b7a8d",fontSize:16,lineHeight:1.7,marginBottom:36,maxWidth:440,margin:"0 auto 36px"}}>{t.hero.sub}</p>
          <button onClick={()=>go("calculator")} style={{background:`linear-gradient(135deg,${C.cyan},${C.green})`,border:"none",color:"#0a0d12",fontWeight:800,fontSize:16,cursor:"pointer",padding:"16px 40px",borderRadius:14,boxShadow:`0 4px 40px ${C.cyan}44`,marginBottom:10,letterSpacing:.3}}>{t.hero.cta}</button>
          <div style={{color:"#3a4858",fontSize:12,marginBottom:56}}>{t.hero.ctaSub}</div>
          <div style={{display:"flex",justifyContent:"center",gap:"clamp(20px,5vw,52px)",flexWrap:"wrap"}}>
            {t.hero.stats.map(s=>(
              <div key={s.l} style={{textAlign:"center"}}>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:22,background:`linear-gradient(90deg,${C.cyan},${C.green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{s.v}</div>
                <div style={{color:"#4a5868",fontSize:11,marginTop:3,fontWeight:500}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ── CALCULATOR ── */}
      <section id="calculator" style={{background:"#080b0f",padding:"52px 20px 60px"}}>
        <div style={{maxWidth:520,margin:"0 auto"}}>

          {/* Goal */}
          <h2 style={{textAlign:"center",fontWeight:800,fontSize:20,marginBottom:20,color:"#d8e4f0"}}>{t.goals.title}</h2>
          <div style={{display:"flex",gap:10,marginBottom:30}}>
            {t.goals.list.map(g=>(
              <button key={g.key} onClick={()=>{setGoal(g.key);setRes(null);}} style={{flex:1,padding:"16px 6px",borderRadius:16,cursor:"pointer",textAlign:"center",
                border:`2px solid ${goal===g.key?g.color+"99":"#161e2a"}`,
                background:goal===g.key?`${g.color}15`:"#111620",
                transition:"all .18s",boxShadow:goal===g.key?`0 0 20px ${g.color}22`:"none"}}>
                <div style={{fontSize:24,marginBottom:5}}>{g.emoji}</div>
                <div style={{fontWeight:700,fontSize:12,color:goal===g.key?g.color:"#8a96a8"}}>{g.label}</div>
                <div style={{fontSize:9,color:"#3a4858",marginTop:3,lineHeight:1.4}}>{g.desc}</div>
              </button>
            ))}
          </div>

          {/* Form */}
          <Card>
            <Label>{t.form.title}</Label>
            <div style={{marginBottom:20}}>
              <div style={{color:"#6b7a8d",fontSize:11,fontWeight:600,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>{t.form.gender}</div>
              <div style={{display:"flex",gap:8}}>
                {[["male",t.form.male],["female",t.form.female]].map(([v,l])=>(
                  <button key={v} onClick={()=>setGender(v)} style={{flex:1,padding:"12px 0",borderRadius:11,
                    border:`1.5px solid ${gender===v?C.cyan:"#1e2a3a"}`,
                    background:gender===v?`${C.cyan}15`:"#0d1118",
                    color:gender===v?C.cyan:"#4a5868",fontWeight:700,fontSize:13,cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>{l}</button>
                ))}
              </div>
            </div>
            <Slider label={t.form.age} value={age} min={16} max={70} onChange={setAge} unit={t.form.ageU} color={C.cyan}/>
            <Slider label={t.form.weight} value={wt} min={40} max={200} onChange={setWt} unit={t.form.weightU} color={C.green}/>
            <Slider label={t.form.height} value={ht} min={140} max={220} onChange={setHt} unit={t.form.heightU} color={C.cyan}/>
            <Slider label={t.form.kfa} value={kfa} min={5} max={50} onChange={setKfa} unit={t.form.kfaU} color={C.orange}/>
          </Card>

          {/* Activity */}
          <div style={{marginBottom:22}}>
            <Label>{t.form.actTitle}</Label>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {t.form.acts.map((a,i)=>(
                <button key={i} onClick={()=>setAct(i)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"12px 16px",borderRadius:12,cursor:"pointer",textAlign:"left",
                  border:`1.5px solid ${act===i?gc+"88":"#161e2a"}`,
                  background:act===i?`${gc}12`:"#111620",
                  color:act===i?gc:"#4a5868",transition:"all .15s"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{a.l}</div>
                    <div style={{fontSize:10,opacity:.65,marginTop:2}}>{a.d}</div>
                  </div>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,opacity:act===i?1:.4}}>×{ACT[i]}</span>
                </button>
              ))}
            </div>
          </div>

          {/* CTA */}
          <button onClick={calc} style={{width:"100%",padding:"17px 0",borderRadius:14,border:"none",
            background:`linear-gradient(135deg,${gc},${gc}bb)`,color:"#0a0d12",fontWeight:800,fontSize:15,cursor:"pointer",
            boxShadow:`0 4px 28px ${gc}44`,marginBottom:36,letterSpacing:.3}}>
            {t.form.btn}
          </button>

          {/* Results */}
          {res&&(
            <div key={ak} ref={ref}>
              {/* Tabs */}
              <div style={{display:"flex",gap:5,marginBottom:16,background:"#111620",borderRadius:13,padding:4,border:"1px solid #161e2a"}}>
                {[{k:"results",l:t.tabs.results},{k:"aiplan",l:t.tabs.aiplan},{k:"tracking",l:t.tabs.tracking}].map(tb=>(
                  <button key={tb.k} onClick={()=>{if(tb.k!=="results"){setModal(true);}else{setTab(tb.k);}}}
                    style={{flex:1,padding:"9px 4px",borderRadius:10,border:"none",fontSize:10,fontWeight:700,cursor:"pointer",
                      background:tab===tb.k?gc:"transparent",
                      color:tab===tb.k?"#0a0d12":"#4a5868",position:"relative",transition:"all .15s",letterSpacing:.2}}>
                    {tb.l}
                    {tb.k!=="results"&&<span style={{position:"absolute",top:3,right:4,fontSize:8}}>🔒</span>}
                  </button>
                ))}
              </div>

              {/* Results tab */}
              {tab==="results"&&(
                <div className="fade-up">
                  {/* TDEE */}
                  <Card style={{textAlign:"center"}} glow={C.cyan}>
                    <Label>{t.res.tdee}</Label>
                    <Ring value={res.tdee} max={4500} label={t.res.kcalDay} color={C.cyan} size={168}/>
                    <div style={{marginTop:18,display:"flex",justifyContent:"center",gap:32}}>
                      {[{l:t.res.bmr,v:`${res.bmr} kcal`},{l:t.res.lean,v:`${res.lbm} kg`}].map(x=>(
                        <div key={x.l} style={{textAlign:"center"}}>
                          <div style={{color:"#3a4858",fontSize:10,fontWeight:600,marginBottom:3}}>{x.l}</div>
                          <div style={{color:"#8a96a8",fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700}}>{x.v}</div>
                        </div>
                      ))}
                    </div>
                  </Card>

                  {/* Tiers */}
                  <Card>
                    <Label>{t.res.gl[goal]}</Label>
                    {res.tiers.map(({k,l,def,sur,note,kcal,macros},ci)=>{
                      const tc=TCOL[ci];
                      const dl=goal==="cut"?`−${def} kcal ${t.res.def}`:sur===0?"±0 kcal":`+${sur} kcal ${t.res.sur}`;
                      return(
                        <div key={k} style={{marginBottom:ci<res.tiers.length-1?12:0,padding:"15px",borderRadius:14,
                          border:`1px solid ${tc}28`,background:`${tc}07`,position:"relative"}}>
                          {ci===0&&<div style={{position:"absolute",top:-1,right:12,background:tc,color:"#0a0d12",fontSize:9,fontWeight:800,padding:"2px 10px",borderRadius:"0 0 8px 8px",letterSpacing:.5}}>BEST</div>}
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:7}}>
                            <span style={{color:tc,fontWeight:700,fontSize:14}}>{l}</span>
                            <span style={{color:tc,fontFamily:"'JetBrains Mono',monospace",fontSize:19,fontWeight:800}}>{kcal.toLocaleString()}<span style={{fontSize:11,marginLeft:3}}>kcal</span></span>
                          </div>
                          <div style={{fontSize:10,color:"#3a4858",marginBottom:11,fontWeight:500}}>{dl} · {note}</div>
                          <div style={{display:"flex",gap:7}}>
                            {[{n:t.res.prot,v:macros.prot,c:C.pink},{n:t.res.carbs,v:macros.carb,c:C.yellow},{n:t.res.fat,v:macros.fat,c:C.lime}].map(m=>(
                              <div key={m.n} style={{flex:1,textAlign:"center",padding:"9px 4px",background:"#0a0d12",borderRadius:10,border:`1px solid ${m.c}22`}}>
                                <div style={{color:m.c,fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:13}}>{m.v}g</div>
                                <div style={{color:"#3a4858",fontSize:9,marginTop:3,fontWeight:600}}>{m.n}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </Card>

                  {/* Tips */}
                  <Card>
                    <Label>{t.res.tips.title}</Label>
                    {t.res.tips[goal](res.protein).map((tip,i)=>(
                      <div key={i} style={{display:"flex",gap:10,marginBottom:11,fontSize:13,color:"#8a96a8",lineHeight:1.65}}>
                        <span style={{flexShrink:0}}>{tip.slice(0,2)}</span>
                        <span>{tip.slice(2)}</span>
                      </div>
                    ))}
                  </Card>

                  {/* Premium teaser */}
                  <button onClick={()=>setModal(true)} style={{width:"100%",padding:"18px",borderRadius:16,
                    border:`1.5px solid ${C.gold}50`,background:`linear-gradient(135deg,${C.gold}12,${C.gold}06)`,
                    cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",
                    boxShadow:`0 4px 24px ${C.gold}18`}}>
                    <div style={{textAlign:"left"}}>
                      <div style={{color:C.gold,fontWeight:800,fontSize:14,marginBottom:3}}>{t.res.premCta}</div>
                      <div style={{color:"#4a5868",fontSize:11}}>{t.res.premSub}</div>
                    </div>
                    <div style={{background:`linear-gradient(90deg,${C.gold},#fb923c)`,color:"#0a0d12",fontWeight:800,fontSize:11,padding:"8px 14px",borderRadius:10,flexShrink:0}}>Premium ✦</div>
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      </section>

      {/* ── PRICING ── */}
      <section id="pricing" style={{background:"#0a0d12",padding:"80px 20px"}}>
        <div style={{maxWidth:680,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:48}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${C.gold}15`,border:`1px solid ${C.gold}35`,borderRadius:999,padding:"5px 15px",marginBottom:20}}>
              <span style={{color:C.gold,fontSize:11,fontWeight:700,letterSpacing:1.2}}>✦ {t.prem.badge}</span>
            </div>
            <h2 style={{fontWeight:900,fontSize:"clamp(24px,5vw,38px)",margin:"0 0 12px",letterSpacing:-1,lineHeight:1.1}}>
              {t.prem.title}<br/>
              <span style={{background:`linear-gradient(90deg,${C.gold},#fb923c)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{t.prem.titleB}</span>
            </h2>
            <p style={{color:"#6b7a8d",fontSize:15}}>{t.prem.sub}</p>
          </div>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",justifyContent:"center"}}>
            {t.prem.plans.map((plan,pi)=>(
              <div key={pi} style={{flex:"1 1 240px",maxWidth:295,borderRadius:22,padding:"28px 24px",position:"relative",
                border:`2px solid ${plan.hi?C.gold+"66":"#161e2a"}`,
                background:plan.hi?`linear-gradient(160deg,${C.gold}12,#12100200,#0a0d12)`:"#111620",
                boxShadow:plan.hi?`0 8px 40px ${C.gold}18`:"none"}}>
                {plan.hi&&<div style={{position:"absolute",top:-13,left:"50%",transform:"translateX(-50%)",background:`linear-gradient(90deg,${C.gold},#fb923c)`,color:"#0a0d12",fontWeight:800,fontSize:10,padding:"4px 16px",borderRadius:999,letterSpacing:.8,whiteSpace:"nowrap"}}>✦ {t.prem.popular}</div>}
                <div style={{marginBottom:20}}>
                  <div style={{color:plan.hi?C.gold:"#6b7a8d",fontWeight:700,fontSize:13,marginBottom:8}}>{plan.name}</div>
                  <div style={{display:"flex",alignItems:"baseline",gap:5}}>
                    <span style={{fontSize:34,fontWeight:900,color:"#eef2f7"}}>{plan.price}</span>
                    <span style={{color:"#3a4858",fontSize:13}}>/ {plan.period}</span>
                  </div>
                </div>
                <div style={{borderTop:"1px solid #161e2a",paddingTop:20,marginBottom:24}}>
                  {plan.features.map((f,fi)=>(
                    <div key={fi} style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}}>
                      <span style={{color:plan.hi?C.gold:C.green,fontSize:13,marginTop:1,flexShrink:0}}>✓</span>
                      <span style={{color:"#c8d4e0",fontSize:13,lineHeight:1.4}}>{f}</span>
                    </div>
                  ))}
                </div>
                <button onClick={plan.hi?()=>setModal(true):undefined} style={{width:"100%",padding:"13px 0",borderRadius:11,border:"none",
                  cursor:plan.hi?"pointer":"default",fontWeight:700,fontSize:13,
                  background:plan.hi?`linear-gradient(90deg,${C.gold},#fb923c)`:"#161e2a",
                  color:plan.hi?"#0a0d12":"#3a4858"}}>{plan.cta}</button>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{borderTop:"1px solid #111820",padding:"44px 20px",background:"#07090d",textAlign:"center"}}>
        <div style={{fontWeight:900,fontSize:17,background:`linear-gradient(90deg,${C.cyan},${C.green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1.1,marginBottom:3}}>MacroCoach</div>
        <div style={{fontSize:10,color:"#2a3848",fontWeight:500,letterSpacing:.5,marginBottom:16}}>by christhetic</div>
        <div style={{color:"#3a4858",fontSize:11,marginBottom:18,fontWeight:500}}>{t.footer.tag}</div>
        <div style={{display:"flex",justifyContent:"center",gap:24,marginBottom:20,flexWrap:"wrap"}}>
          {t.footer.links.map(l=><a key={l} href="#" style={{color:"#2a3848",fontSize:11,textDecoration:"none",fontWeight:500}}>{l}</a>)}
        </div>
        <div style={{color:"#1a2232",fontSize:10}}>{t.footer.copy} · by christhetic</div>
      </footer>

      {/* ── MODAL ── */}
      {modal&&(
        <div style={{position:"fixed",inset:0,background:"#00000099",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(4px)"}} onClick={()=>setModal(false)}>
          <div style={{background:"#111620",borderRadius:24,border:`2px solid ${C.gold}55`,padding:"36px 28px",maxWidth:380,width:"100%",position:"relative",boxShadow:`0 24px 80px #000000aa,0 0 40px ${C.gold}22`}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setModal(false)} style={{position:"absolute",top:16,right:16,background:"#161e2a",border:"none",color:"#6b7a8d",fontSize:18,cursor:"pointer",width:32,height:32,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
            <div style={{textAlign:"center",marginBottom:24}}>
              <div style={{fontSize:40,marginBottom:10}}>✨</div>
              <h3 style={{margin:"0 0 8px",fontWeight:900,fontSize:21,color:"#eef2f7"}}>{t.modal.title}</h3>
              <p style={{color:"#6b7a8d",fontSize:13,margin:0,lineHeight:1.5}}>{t.prem.sub}</p>
            </div>
            {t.modal.features.map(x=>(
              <div key={x.l} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,padding:"10px 14px",background:`${C.gold}0d`,borderRadius:12,border:`1px solid ${C.gold}18`}}>
                <span style={{fontSize:20}}>{x.e}</span>
                <span style={{color:"#c8d4e0",fontSize:13,fontWeight:600}}>{x.l}</span>
                <span style={{marginLeft:"auto",color:C.gold,fontWeight:800,fontSize:12}}>✓</span>
              </div>
            ))}
            <div style={{textAlign:"center",margin:"22px 0 16px"}}>
              <span style={{fontSize:34,fontWeight:900,color:"#eef2f7"}}>{t.modal.price}</span>
              <span style={{color:"#4a5868",fontSize:13}}> / {t.modal.period}</span>
            </div>
            <div style={{textAlign:"center",padding:"18px 16px",borderRadius:14,border:`1px solid ${C.gold}35`,background:`${C.gold}0a`,marginBottom:14}}>
              <div style={{fontSize:28,marginBottom:8}}>🚀</div>
              <div style={{color:C.gold,fontWeight:800,fontSize:16,marginBottom:5}}>{t.modal.soon}</div>
              <div style={{color:"#6b7a8d",fontSize:13,lineHeight:1.6}}>{t.modal.soonSub}</div>
            </div>
            <p style={{textAlign:"center",color:"#3a4858",fontSize:11,margin:0}}>{t.modal.tiktok}</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
