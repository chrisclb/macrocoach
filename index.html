function Ring({value,max,label,color,size=160}){
  const [d,setD]=useState(0);
  const r=size/2*0.78,circ=2*Math.PI*r;
  useEffect(()=>{
    if(!value){setD(0);return;}
    let s=null;const dur=900,to=value;
    const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1),e=1-Math.pow(1-p,3);setD(Math.round(to*e));if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  },[value]);
  const off=circ*(1-Math.min(d/max,1));
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e2530" strokeWidth={size*0.09}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={size*0.09}
          strokeDasharray={circ} strokeDashoffset={value?off:circ} strokeLinecap="round"
          style={{transition:"stroke-dashoffset 0.05s linear"}}/>
        <text x={size/2} y={size/2+2} textAnchor="middle" dominantBaseline="middle"
          fill="#f0f4f8" fontSize={size*0.17} fontWeight="700" fontFamily="monospace"
          style={{transformOrigin:`${size/2}px ${size/2}px`,transform:"rotate(90deg)"}}>
          {d>0?d.toLocaleString():"–"}
        </text>
      </svg>
      <span style={{color:"#8a9bb0",fontSize:11,letterSpacing:2,textTransform:"uppercase"}}>{label}</span>
    </div>
  );
}

function Slider({label,value,min,max,unit,onChange,color="#00d4ff"}){
  const pct=((value-min)/(max-min))*100;
  return (
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
        <span style={{color:"#8a9bb0",fontSize:13}}>{label}</span>
        <span style={{color,fontFamily:"monospace",fontSize:15,fontWeight:700}}>{value}{unit}</span>
      </div>
      <div style={{position:"relative",height:6,borderRadius:3,background:"#1e2530"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,borderRadius:3,background:`linear-gradient(90deg,${color}88,${color})`}}/>
        <input type="range" min={min} max={max} value={value} onChange={e=>onChange(Number(e.target.value))}
          style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0,cursor:"pointer",margin:0}}/>
        <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",
          width:16,height:16,borderRadius:"50%",background:color,border:"2px solid #0d1117",
          pointerEvents:"none",boxShadow:`0 0 8px ${color}88`}}/>
      </div>
    </div>
  );
}

function App(){
  const [lang,setLang]=useState("de");
  const [showLangMenu,setShowLangMenu]=useState(false);
  const [goal,setGoal]=useState("cut");
  const [gender,setGender]=useState("male");
  const [age,setAge]=useState(25);
  const [weight,setWeight]=useState(85);
  const [height,setHeight]=useState(178);
  const [kfa,setKfa]=useState(20);
  const [actIdx,setActIdx]=useState(2);
  const [result,setResult]=useState(null);
  const [animKey,setAnimKey]=useState(0);
  const [showModal,setShowModal]=useState(false);
  const resultsRef=useRef(null);
  const t=LANGS[lang];
  const cyan="#00d4ff",green="#00ff9d",orange="#ff7b35",gold="#f59e0b";
  const goalColor=GOAL_COLORS[goal];

  function calculate(){
    const lbm=weight*(1-kfa/100);
    const bmr=370+21.6*lbm;
    const tdee=Math.round(bmr*ACT_FACTORS[actIdx]);
    const protein=Math.round(lbm*2.2);
    const tiers=t.results.tiers[goal].map(tier=>{
      const kcal=goal==="cut"?tdee-tier.def:tdee+(tier.sur||0);
      const protKcal=protein*4,fatKcal=Math.round(kcal*0.22),carbKcal=kcal-protKcal-fatKcal;
      return {...tier,kcal,macros:{prot:protein,fat:Math.round(fatKcal/9),carb:Math.round(Math.max(carbKcal,0)/4)}};
    });
    setAnimKey(k=>k+1);
    setResult({tdee,bmr:Math.round(bmr),lbm:Math.round(lbm),protein,tiers});
    setTimeout(()=>resultsRef.current?.scrollIntoView({behavior:"smooth",block:"start"}),100);
  }

  const scrollTo=id=>{document.getElementById(id)?.scrollIntoView({behavior:"smooth"});setShowLangMenu(false);};

  return (
    <div style={{minHeight:"100vh",background:"#0d1117",color:"#f0f4f8"}} onClick={()=>showLangMenu&&setShowLangMenu(false)}>

      {/* NAV */}
      <nav style={{position:"sticky",top:0,zIndex:50,background:"#0d1117ee",backdropFilter:"blur(12px)",borderBottom:"1px solid #1e2d3d",padding:"0 20px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:60}}>
          <span style={{fontWeight:900,fontSize:18,background:`linear-gradient(90deg,${cyan},${green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{t.nav.logo}</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>scrollTo("pricing")} style={{background:"none",border:"none",color:"#8a9bb0",fontSize:13,cursor:"pointer",padding:"7px 10px",borderRadius:8}}>{t.nav.pricing}</button>
            <button onClick={()=>scrollTo("calculator")} style={{background:`linear-gradient(90deg,${cyan},${green})`,border:"none",color:"#0d1117",fontWeight:700,fontSize:12,cursor:"pointer",padding:"8px 16px",borderRadius:8}}>{t.nav.start}</button>
            <div style={{position:"relative"}} onClick={e=>e.stopPropagation()}>
              <button onClick={()=>setShowLangMenu(v=>!v)} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:8,border:"1.5px solid #1e2d3d",background:"#121a24",color:"#8a9bb0",fontSize:13,cursor:"pointer"}}>
                <span style={{fontSize:15}}>{LANGS[lang].flag}</span><span style={{fontSize:9,opacity:0.5}}>▼</span>
              </button>
              {showLangMenu&&(
                <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",background:"#121a24",border:"1px solid #1e2d3d",borderRadius:12,overflow:"hidden",minWidth:150,boxShadow:"0 8px 32px #000a",zIndex:100}}>
                  {Object.entries(LANGS).map(([k,l])=>(
                    <button key={k} onClick={()=>{setLang(k);setResult(null);setShowLangMenu(false);}} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 16px",background:lang===k?`${cyan}15`:"transparent",border:"none",color:lang===k?cyan:"#8a9bb0",fontSize:13,cursor:"pointer",fontWeight:lang===k?700:400,textAlign:"left",borderBottom:"1px solid #1e2d3d"}}>
                      <span style={{fontSize:15}}>{l.flag}</span>{l.name}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      </nav>

      {/* HERO */}
      <section style={{background:"radial-gradient(ellipse 80% 60% at 50% -10%,#00d4ff18,transparent)",padding:"80px 20px 60px",textAlign:"center"}}>
        <div style={{maxWidth:540,margin:"0 auto"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${cyan}15`,border:`1px solid ${cyan}40`,borderRadius:999,padding:"5px 14px",marginBottom:24}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:cyan,display:"inline-block"}}/>
            <span style={{color:cyan,fontSize:11,fontWeight:600,letterSpacing:1}}>{t.hero.badge}</span>
          </div>
          <h1 style={{margin:"0 0 18px",fontSize:"clamp(28px,8vw,52px)",fontWeight:900,lineHeight:1.1,letterSpacing:-1}}>
            <span style={{color:"#f0f4f8"}}>{t.hero.h1a} </span>
            <span style={{background:`linear-gradient(90deg,${cyan},${green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{t.hero.h1b} </span>
            <span style={{color:"#f0f4f8"}}>{t.hero.h1c}</span>
          </h1>
          <p style={{color:"#8a9bb0",fontSize:16,lineHeight:1.6,marginBottom:32}}>{t.hero.sub}</p>
          <button onClick={()=>scrollTo("calculator")} style={{background:`linear-gradient(90deg,${cyan},${green})`,border:"none",color:"#0d1117",fontWeight:800,fontSize:16,cursor:"pointer",padding:"15px 36px",borderRadius:12,boxShadow:`0 0 36px ${cyan}44`,marginBottom:8}}>{t.hero.cta}</button>
          <div style={{color:"#5a6a7a",fontSize:12,marginBottom:48}}>{t.hero.ctaSub}</div>
          <div style={{display:"flex",justifyContent:"center",gap:"clamp(16px,4vw,44px)",flexWrap:"wrap"}}>
            {t.hero.stats.map(s=>(
              <div key={s.l} style={{textAlign:"center"}}>
                <div style={{fontFamily:"monospace",fontWeight:800,fontSize:20,background:`linear-gradient(90deg,${cyan},${green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{s.v}</div>
                <div style={{color:"#5a6a7a",fontSize:11,marginTop:2}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CALCULATOR */}
      <section id="calculator" style={{background:"#080c10",padding:"48px 20px"}}>
        <div style={{maxWidth:520,margin:"0 auto"}}>
          <h2 style={{textAlign:"center",fontWeight:800,fontSize:20,marginBottom:20,color:"#f0f4f8"}}>{t.goals.title}</h2>
          <div style={{display:"flex",gap:10,marginBottom:28}}>
            {t.goals.list.map(g=>(
              <button key={g.key} onClick={()=>{setGoal(g.key);setResult(null);}} style={{flex:1,padding:"14px 6px",borderRadius:14,cursor:"pointer",textAlign:"center",border:`2px solid ${goal===g.key?g.color:"#1e2d3d"}`,background:goal===g.key?`${g.color}18`:"#121a24"}}>
                <div style={{fontSize:22,marginBottom:3}}>{g.emoji}</div>
                <div style={{fontWeight:700,fontSize:12,color:goal===g.key?g.color:"#8a9bb0"}}>{g.label}</div>
                <div style={{fontSize:9,color:"#5a6a7a",marginTop:2,lineHeight:1.3}}>{g.desc}</div>
              </button>
            ))}
          </div>

          <div style={{background:"#121a24",borderRadius:20,border:"1px solid #1e2d3d",padding:"24px 20px",marginBottom:16}}>
            <div style={{color:"#8a9bb0",fontSize:10,letterSpacing:3,textTransform:"uppercase",marginBottom:18}}>{t.form.title}</div>
            <div style={{marginBottom:18}}>
              <div style={{color:"#8a9bb0",fontSize:11,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>{t.form.gender}</div>
              <div style={{display:"flex",gap:10}}>
                {[["male",t.form.male],["female",t.form.female]].map(([v,l])=>(
                  <button key={v} onClick={()=>setGender(v)} style={{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${gender===v?cyan:"#1e2d3d"}`,background:gender===v?`${cyan}15`:"#0d1117",color:gender===v?cyan:"#5a6a7a",fontWeight:700,fontSize:13,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
            </div>
            <Slider label={t.form.age} value={age} min={16} max={70} onChange={setAge} unit={t.form.ageU} color={cyan}/>
            <Slider label={t.form.weight} value={weight} min={40} max={200} onChange={setWeight} unit={t.form.weightU} color={green}/>
            <Slider label={t.form.height} value={height} min={140} max={220} onChange={setHeight} unit={t.form.heightU} color={cyan}/>
            <Slider label={t.form.kfa} value={kfa} min={5} max={50} onChange={setKfa} unit={t.form.kfaU} color={orange}/>
          </div>

          <div style={{marginBottom:20}}>
            <div style={{color:"#8a9bb0",fontSize:10,letterSpacing:3,textTransform:"uppercase",marginBottom:10}}>{t.form.actTitle}</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {t.form.acts.map((a,i)=>(
                <button key={i} onClick={()=>setActIdx(i)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",borderRadius:10,border:`1.5px solid ${actIdx===i?goalColor:"#1e2d3d"}`,background:actIdx===i?`${goalColor}10`:"#121a24",color:actIdx===i?goalColor:"#5a6a7a",cursor:"pointer",textAlign:"left"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{a.l}</div>
                    <div style={{fontSize:10,opacity:0.7,marginTop:1}}>{a.d}</div>
                  </div>
                  <span style={{fontFamily:"monospace",fontSize:11,opacity:actIdx===i?1:0.4}}>×{ACT_FACTORS[i]}</span>
                </button>
              ))}
            </div>
          </div>

          <button onClick={calculate} style={{width:"100%",padding:"16px 0",borderRadius:12,border:"none",background:`linear-gradient(90deg,${goalColor},${goalColor}bb)`,color:"#0d1117",fontWeight:800,fontSize:15,cursor:"pointer",boxShadow:`0 0 24px ${goalColor}44`,marginBottom:32}}>{t.form.btn}</button>

          {result&&(
            <div key={animKey} ref={resultsRef}>
              <div style={{background:"#121a24",borderRadius:16,border:"1px solid #1e2d3d",padding:"24px 20px",marginBottom:14,textAlign:"center"}}>
                <div style={{color:"#8a9bb0",fontSize:10,letterSpacing:3,textTransform:"uppercase",marginBottom:14}}>{t.results.tdeeLabel}</div>
                <Ring value={result.tdee} max={4500} label={t.results.kcalDay} color={cyan} size={160}/>
                <div style={{marginTop:14,display:"flex",justifyContent:"center",gap:24}}>
                  {[{l:t.results.bmr,v:`${result.bmr} kcal`},{l:t.results.lean,v:`${result.lbm} kg`}].map(x=>(
                    <div key={x.l} style={{textAlign:"center"}}>
                      <div style={{color:"#5a6a7a",fontSize:10}}>{x.l}</div>
                      <div style={{color:"#8a9bb0",fontFamily:"monospace",fontSize:13,fontWeight:700}}>{x.v}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{background:"#121a24",borderRadius:16,border:"1px solid #1e2d3d",padding:"20px",marginBottom:14}}>
                <div style={{color:"#8a9bb0",fontSize:10,letterSpacing:3,textTransform:"uppercase",marginBottom:18}}>{t.results.goalLabel[goal]}</div>
                {result.tiers.map(({k,l,def,sur,note,kcal,macros},ci)=>{
                  const tc=TIER_COLORS[ci];
                  const diffLabel=goal==="cut"?`−${def} kcal ${t.results.deficit}`:sur===0?"±0 kcal":`+${sur} kcal ${t.results.surplus}`;
                  return (
                    <div key={k} style={{marginBottom:ci<result.tiers.length-1?14:0,padding:"14px",borderRadius:12,border:`1px solid ${tc}30`,background:`${tc}08`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:7}}>
                        <span style={{color:tc,fontWeight:700,fontSize:14}}>{l}</span>
                        <span style={{color:tc,fontFamily:"monospace",fontSize:18,fontWeight:800}}>{kcal.toLocaleString()} kcal</span>
                      </div>
                      <div style={{fontSize:10,color:"#5a6a7a",marginBottom:10}}>{diffLabel} · {note}</div>
                      <div style={{display:"flex",gap:7}}>
                        {[{n:t.results.prot,v:macros.prot,c:"#ff6b9d"},{n:t.results.carbs,v:macros.carb,c:"#ffd93d"},{n:t.results.fat,v:macros.fat,c:"#6bcb77"}].map(m=>(
                          <div key={m.n} style={{flex:1,textAlign:"center",padding:"8px 4px",background:"#0d1117",borderRadius:8,border:`1px solid ${m.c}25`}}>
                            <div style={{color:m.c,fontFamily:"monospace",fontWeight:700,fontSize:13}}>{m.v}g</div>
                            <div style={{color:"#5a6a7a",fontSize:9,marginTop:2}}>{m.n}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div style={{background:"#121a24",borderRadius:16,border:"1px solid #1e2d3d",padding:"18px 20px",marginBottom:14}}>
                <div style={{color:"#8a9bb0",fontSize:10,letterSpacing:3,textTransform:"uppercase",marginBottom:12}}>{t.results.tipsTitle}</div>
                {t.results.tips[goal](result.protein).map((tip,i)=>(
                  <div key={i} style={{marginBottom:9,fontSize:13,color:"#8a9bb0",lineHeight:1.6}}>{tip}</div>
                ))}
              </div>

              <button onClick={()=>setShowModal(true)} style={{width:"100%",padding:"16px",borderRadius:14,border:`1.5px solid ${gold}60`,background:`linear-gradient(135deg,${gold}18,${gold}08)`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <div style={{textAlign:"left"}}>
                  <div style={{color:gold,fontWeight:800,fontSize:14}}>{t.results.premiumCta}</div>
                  <div style={{color:"#8a9bb0",fontSize:11,marginTop:2}}>{t.results.premiumSub}</div>
                </div>
                <div style={{background:gold,color:"#0d1117",fontWeight:800,fontSize:11,padding:"6px 12px",borderRadius:8}}>Premium ✦</div>
              </button>
            </div>
          )}
        </div>
      </section>

      {/* PRICING */}
      <section id="pricing" style={{background:"#0d1117",padding:"80px 20px"}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:44}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${gold}18`,border:`1px solid ${gold}40`,borderRadius:999,padding:"5px 14px",marginBottom:18}}>
              <span style={{color:gold,fontSize:11,fontWeight:700,letterSpacing:1}}>✦ {t.premium.badge}</span>
            </div>
            <h2 style={{fontWeight:900,fontSize:"clamp(22px,5vw,36px)",margin:"0 0 10px",letterSpacing:-0.5}}>
              {t.premium.title}<br/>
              <span style={{background:`linear-gradient(90deg,${gold},#fb923c)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{t.premium.titleB}</span>
            </h2>
            <p style={{color:"#8a9bb0",fontSize:14}}>{t.premium.sub}</p>
          </div>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",justifyContent:"center"}}>
            {t.premium.plans.map((plan,pi)=>(
              <div key={pi} style={{flex:"1 1 240px",maxWidth:300,borderRadius:20,padding:"26px 22px",position:"relative",border:`2px solid ${plan.highlight?gold:"#1e2d3d"}`,background:plan.highlight?`linear-gradient(135deg,${gold}10,#1a1200)`:"#121a24"}}>
                {plan.highlight&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:`linear-gradient(90deg,${gold},#fb923c)`,color:"#0d1117",fontWeight:800,fontSize:10,padding:"3px 14px",borderRadius:999,letterSpacing:1}}>✦ {t.premium.popular}</div>}
                <div style={{marginBottom:18}}>
                  <div style={{color:plan.highlight?gold:"#8a9bb0",fontWeight:700,fontSize:13,marginBottom:6}}>{plan.name}</div>
                  <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                    <span style={{fontSize:32,fontWeight:900,color:"#f0f4f8"}}>{plan.price}</span>
                    <span style={{color:"#5a6a7a",fontSize:12}}>/ {plan.period}</span>
                  </div>
                </div>
                <div style={{borderTop:"1px solid #1e2d3d",paddingTop:18,marginBottom:22}}>
                  {plan.features.map((f,fi)=>(
                    <div key={fi} style={{display:"flex",alignItems:"center",gap:9,marginBottom:9}}>
                      <span style={{color:plan.highlight?gold:green,fontSize:13}}>✓</span>
                      <span style={{color:"#c0cdd8",fontSize:12}}>{f}</span>
                    </div>
                  ))}
                </div>
                <button onClick={plan.highlight?()=>setShowModal(true):undefined} style={{width:"100%",padding:"12px 0",borderRadius:10,border:"none",cursor:plan.highlight?"pointer":"default",background:plan.highlight?`linear-gradient(90deg,${gold},#fb923c)`:"#1e2d3d",color:plan.highlight?"#0d1117":"#5a6a7a",fontWeight:700,fontSize:13}}>{plan.cta}</button>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer style={{borderTop:"1px solid #1e2d3d",padding:"36px 20px",background:"#080c10",textAlign:"center"}}>
        <div style={{fontWeight:900,fontSize:16,background:`linear-gradient(90deg,${cyan},${green})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:6}}>{t.nav.logo}</div>
        <div style={{color:"#5a6a7a",fontSize:11,marginBottom:16}}>{t.footer.tag}</div>
        <div style={{display:"flex",justifyContent:"center",gap:20,marginBottom:16}}>
          {t.footer.links.map(l=><a key={l} href="#" style={{color:"#5a6a7a",fontSize:11,textDecoration:"none"}}>{l}</a>)}
        </div>
        <div style={{color:"#3a4a5a",fontSize:10}}>{t.footer.copy}</div>
      </footer>

      {/* MODAL */}
      {showModal&&(
        <div style={{position:"fixed",inset:0,background:"#000000cc",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setShowModal(false)}>
          <div style={{background:"#121a24",borderRadius:20,border:`2px solid ${gold}60`,padding:"32px 24px",maxWidth:380,width:"100%",position:"relative"}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setShowModal(false)} style={{position:"absolute",top:14,right:14,background:"none",border:"none",color:"#5a6a7a",fontSize:20,cursor:"pointer"}}>×</button>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:36,marginBottom:6}}>✨</div>
              <h3 style={{margin:"0 0 6px",fontWeight:900,fontSize:20,color:"#f0f4f8"}}>MacroCoach Premium</h3>
              <p style={{color:"#8a9bb0",fontSize:13,margin:0}}>{t.premium.sub}</p>
            </div>
            {[{e:"🤖",t:"KI-Wochenplan"},{e:"🍽️",t:"Mahlzeitenvorschläge"},{e:"📊",t:"Fortschritts-Tracking"},{e:"📄",t:"PDF Export"}].map(x=>(
              <div key={x.t} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,padding:"9px 12px",background:`${gold}10`,borderRadius:10,border:`1px solid ${gold}20`}}>
                <span style={{fontSize:18}}>{x.e}</span>
                <span style={{color:"#c0cdd8",fontSize:13,fontWeight:600}}>{x.t}</span>
                <span style={{marginLeft:"auto",color:gold,fontWeight:700,fontSize:12}}>✓</span>
              </div>
            ))}
            <div style={{textAlign:"center",margin:"20px 0 14px"}}>
              <span style={{fontSize:32,fontWeight:900,color:"#f0f4f8"}}>4,99€</span>
              <span style={{color:"#5a6a7a",fontSize:12}}> / einmalig</span>
            </div>
            <button style={{width:"100%",padding:"14px 0",borderRadius:12,border:"none",cursor:"pointer",background:`linear-gradient(90deg,${gold},#fb923c)`,color:"#0d1117",fontWeight:800,fontSize:15,boxShadow:`0 0 28px ${gold}44`}}>✨ Jetzt freischalten</button>
            <p style={{textAlign:"center",color:"#5a6a7a",fontSize:10,marginTop:10,marginBottom:0}}>🔒 Sichere Zahlung via Stripe</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
